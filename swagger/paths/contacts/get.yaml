tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Get all user contacts with optional sorting and pagination.
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: Page number for pagination.
    schema:
      type: integer
      example: 1
      default: 1
  - in: query
    name: perPage
    description: Number of contacts per page.
    schema:
      type: integer
      example: 10
      default: 10
  - in: query
    name: sortBy
    description: Field to sort by (e.g., `name`).
    schema:
      type: string
      example: "name"
      default: "name"
  - in: query
    name: sortOrder
    description: Sort order (`asc` for ascending, `desc` for descending).
    schema:
      type: string
      enum: [asc, desc]
      example: "asc"
      default: "asc"
responses:
  "200":
    description: Successfully retrieved user contact list.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: "Successfully found contacts!"
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  description: List of contacts matching filters, sorted, and paginated.
                  items:
                    $ref: ../../components/schema/contacts.yaml
                page:
                  type: number
                  description: Current page number.
                  example: 1
                perPage:
                  type: number
                  description: Number of contacts per page.
                  example: 10
                totalItems:
                  type: number
                  description: Total number of contacts matching the filters.
                  example: 15
                totalPages:
                  type: number
                  description: Total number of pages.
                  example: 2
                hasPreviousPage:
                  type: boolean
                  description: Indicates if there is a previous page.
                  example: false
                hasNextPage:
                  type: boolean
                  description: Indicates if there is a next page.
                  example: true
  "401":
    $ref: ../../components/responses/401.yaml
  "500":
    $ref: ../../components/responses/500.yaml
