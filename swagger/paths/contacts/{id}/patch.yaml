#swagger/paths/contacts/{id}/patch.yaml

tags:
  - Contacts
summary: Update contact by ID
operationId: updateContactById
description: Update specific fields of a contact by its unique ID.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: "Jane Doe"
          phoneNumber:
            type: string
            example: "+9876543210"
          email:
            type: string
            example: "jane.doe@example.com"
          photo:
            type: string
            format: binary
            description: Contact's photo file
          isFavourite:
            type: boolean
            description: Mark contact as favorite
            example: true
          contactType:
            type: string
            description: Type of contact
            enum: [work, home, personal]
            example: "work"
responses:
  '200':
    description: Contact updated successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated successfully.
            data:
              type: object
              $ref: ../../../components/schema/contacts.yaml
  "400":
    $ref: ../../../components/responses/400.yaml
  "401":
    $ref: ../../../components/responses/401.yaml
  "404":
    $ref: ../../../components/responses/404.yaml
  "500":
    $ref: ../../../components/responses/500.yaml
