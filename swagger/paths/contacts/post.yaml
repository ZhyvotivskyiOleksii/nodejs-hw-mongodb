tags:
  - Contacts
summary: Create a new contact
operationId: createContact
description: Create a new contact with the provided information.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
        properties:
          name:
            type: string
            description: Name of the contact
            example: "John Doe"
          phoneNumber:
            type: string
            description: Phone number of the contact
            example: "+1234567890"
          email:
            type: string
            description: Email address of the contact
            example: "john.doe@example.com"
          photo:
            type: string
            format: binary
            description: Contact's photo file
          isFavourite:
            type: boolean
            description: Mark contact as favorite
            example: true
          contactType:
            type: string
            description: Type of contact
            enum: [work, home, personal]
            example: "personal"
responses:
  '201':
    description: Contact created successfully
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact created successfully.
            data:
              type: object
              $ref: ../../components/schema/contacts.yaml
  '400':
    $ref: ../../components/responses/400.yaml
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
